name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: Style, analyse statique et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talenda_test
          POSTGRES_USER: talenda
          POSTGRES_PASSWORD: talenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talenda_test
      DB_USERNAME: talenda
      DB_PASSWORD: talenda

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring
          coverage: none

      - name: Dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparation de l'application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrations sur base vierge
        run: php artisan migrate --force --no-interaction

      - name: Tests (Pest)
        run: vendor/bin/pest --compact
